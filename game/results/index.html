<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Results</title>
    <style>
        :root {
            --p: #ff96d3;
            --s: #78b7ff;
            --gold: #ffd700;
            --fail: #ff4444;
            --bg: #050505;
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a20 0%, #000 100%);
        }

        #bg-music-player {
            position: absolute;
            width: 0; height: 0;
            opacity: 0; pointer-events: none;
        }

        .container {
            width: 800px;
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .rank-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding-right: 40px;
        }

        /* --- Initial Hidden State --- */
        .rank-title, .rank-letter, .rank-acc, .song-info, .stat-row, .actions {
            opacity: 0; /* Hidden by default */
        }

        /* --- Animations Triggered by .active Class --- */
        body.active .rank-title { animation: fadeIn 0.5s ease forwards; }
        
        body.active .rank-letter { 
            animation: slam 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            animation-delay: 0.3s; 
        }

        body.active .rank-acc { animation: slideUp 0.5s ease 0.8s forwards; }
        body.active .song-info { animation: slideLeft 0.5s ease 0.2s forwards; }
        body.active .actions { animation: fadeIn 0.5s ease 1.5s forwards; }

        body.active .stat-row { animation: slideLeft 0.4s ease forwards; }
        body.active .stat-row:nth-child(2) { animation-delay: 0.4s; } /* Score */
        body.active .stat-row:nth-child(3) { animation-delay: 0.5s; } /* Combo */
        body.active .stat-row:nth-child(4) { animation-delay: 0.6s; } /* Hits */
        body.active .stat-row:nth-child(5) { animation-delay: 0.7s; } /* Misses */

        .rank-title {
            font-size: 16px; text-transform: uppercase; letter-spacing: 4px; color: #888; margin-bottom: 10px;
        }

        .rank-letter {
            font-size: 180px; font-weight: 900; line-height: 1; margin: 0;
            text-shadow: 0 0 30px currentColor; transform: scale(3);
        }

        .rank-acc { font-size: 24px; font-weight: bold; margin-top: 10px; }

        .stats-section { display: flex; flex-direction: column; justify-content: center; }
        .song-info { margin-bottom: 30px; }
        .song-title { font-size: 32px; font-weight: 800; color: white; margin: 0; }
        .song-artist { font-size: 18px; color: var(--s); margin: 5px 0 0 0; }

        .stat-row {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 15px; padding-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transform: translateX(20px);
        }
        
        .stat-label { font-size: 14px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        .stat-value { font-size: 28px; font-weight: bold; color: white; }

        .actions {
            grid-column: 1 / -1; display: flex; justify-content: center; gap: 20px; margin-top: 20px;
        }

        .btn {
            background: transparent; color: white; border: 2px solid rgba(255,255,255,0.2);
            padding: 12px 40px; font-size: 16px; font-weight: bold; text-transform: uppercase;
            cursor: pointer; transition: 0.2s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }
        .btn:hover { background: white; color: black; box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .btn-primary { border-color: var(--s); color: var(--s); }
        .btn-primary:hover { background: var(--s); color: black; box-shadow: 0 0 20px var(--s); }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideLeft { from { transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slam {
            0% { opacity: 0; transform: scale(5) rotate(-10deg); filter: blur(10px); }
            60% { opacity: 1; transform: scale(0.9) rotate(0deg); }
            80% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }
    </style>
</head>
<body>

    <div id="bg-music-player"></div>

    <div class="container">
        <!-- Rank -->
        <div class="rank-section">
            <div class="rank-title">Evaluation</div>
            <div id="rank-letter" class="rank-letter">?</div>
            <div id="rank-acc" class="rank-acc">0.00%</div>
        </div>

        <!-- Details -->
        <div class="stats-section">
            <div class="song-info">
                <h1 id="song-title" class="song-title">Unknown Song</h1>
                <p id="song-artist" class="song-artist">Artist Name</p>
            </div>

            <div class="stat-row">
                <span class="stat-label">Total Score</span>
                <span id="score-val" class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Max Combo</span>
                <span id="combo-val" class="stat-value">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Perfect Hits</span>
                <span id="hits-val" class="stat-value" style="color:var(--s)">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Misses</span>
                <span id="miss-val" class="stat-value" style="color:var(--fail)">0</span>
            </div>
        </div>

        <!-- Buttons -->
        <div class="actions">
            <button class="btn" onclick="location.href='index.html'">Select Song</button>
            <button class="btn btn-primary" onclick="location.href='player.html'">Retry</button>
        </div>
    </div>

    <script>
        // --- Data Loading ---
        const rawResults = localStorage.getItem('gameResults');
        const chartDataRaw = localStorage.getItem('selectedChart');
        
        let results = { score: 0, combo: 0, hits: 0, misses: 0 };
        let chartInfo = { title: "Test", artist: "Debug" };

        if(rawResults) results = JSON.parse(rawResults);
        if(chartDataRaw) chartInfo = JSON.parse(chartDataRaw);

        const totalNotes = results.hits + results.misses;
        const accuracy = totalNotes > 0 ? (results.hits / totalNotes) : 0;
        const accPercentage = (accuracy * 100).toFixed(2);

        // --- Rank Logic ---
        let rank = "F";
        let rankColor = "#ff4444";
        if(accuracy >= 1.0) { rank = "SS"; rankColor = "#ffd700"; }
        else if(accuracy >= 0.95) { rank = "S"; rankColor = "#ffd700"; }
        else if(accuracy >= 0.90) { rank = "A"; rankColor = "#ff96d3"; }
        else if(accuracy >= 0.80) { rank = "B"; rankColor = "#78b7ff"; }
        else if(accuracy >= 0.60) { rank = "C"; rankColor = "#00ffcc"; }

        // --- Populate DOM ---
        document.getElementById('song-title').innerText = chartInfo.title || "Unknown";
        document.getElementById('song-artist').innerText = chartInfo.artist || "";
        document.getElementById('rank-acc').innerText = accPercentage + "%";
        document.getElementById('rank-acc').style.color = rankColor;
        
        const rankEl = document.getElementById('rank-letter');
        rankEl.innerText = rank;
        rankEl.style.color = rankColor;

        // --- Animation Logic ---
        let animationsTriggered = false;

        function triggerAnimations() {
            if(animationsTriggered) return;
            animationsTriggered = true;

            document.body.classList.add('active'); // CSS Animations start
            
            // Number counters start
            animateValue("score-val", 0, results.score, 1500);
            animateValue("combo-val", 0, results.combo, 1500);
            animateValue("hits-val", 0, results.hits, 1000);
            animateValue("miss-val", 0, results.misses, 1000);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        // --- Music & Trigger Logic ---
        
        // 1. If we played poorly, don't play music, just animate after short delay
        if (accuracy <= 0.60) {
            setTimeout(triggerAnimations, 500);
        } 
        // 2. If we played well, load Youtube
        else {
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            // Safety: If YouTube takes too long (e.g. adblock or net error), trigger anyway
            setTimeout(triggerAnimations, 5000);
        }

        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('bg-music-player', {
                height: '10', width: '10',
                videoId: 'EMNY2A83VJQ',
                playerVars: { 'autoplay': 1, 'controls': 0, 'loop': 1 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.setVolume(20);
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            // Check if playing (State 1) and animations haven't started
            if (event.data === YT.PlayerState.PLAYING && !animationsTriggered) {
                
                // Fade in volume
                let vol = 80;
                const fade = setInterval(() => {
                    if(vol >= 80) clearInterval(fade);
                    vol += 5;
                    event.target.setVolume(vol);
                }, 200);

                // Wait 1 second AFTER video starts playing, then animate
                setTimeout(triggerAnimations, 1000);
            }
        }

    </script>
</body>
</html>
