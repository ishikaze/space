<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Select Chart</title>
    <style>
        :root {
            --p: #ff96d3;
            --s: #78b7ff;
            --bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.85);
            --glass: blur(10px);
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* --- Background Video --- */
        #preview-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
            transition: opacity 0.5s;
            filter: grayscale(0.5);
        }

        /* --- Layout --- */
        #sidebar {
            width: 450px;
            background: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: var(--glass);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        #main-area {
            flex: 1;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            pointer-events: none; /* Let clicks pass to nowhere unless on button */
        }

        h1 {
            color: var(--s);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px var(--s);
            margin-bottom: 30px;
        }

        /* --- Chart List --- */
        #chart-list {
            overflow-y: auto;
            flex: 1;
            padding-right: 10px;
        }

        .chart-card {
            background: var(--card-bg);
            border-left: 4px solid #444;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .chart-card:hover, .chart-card.active {
            background: rgba(40, 40, 50, 0.9);
            border-left-color: var(--p);
            transform: translateX(10px);
            box-shadow: 0 0 20px rgba(255, 150, 211, 0.2);
        }

        .chart-title {
            font-size: 18px;
            font-weight: bold;
            display: block;
        }

        .chart-artist {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .chart-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .diff-tag {
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: bold;
            color: #000;
            font-size: 10px;
            text-transform: uppercase;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        /* --- Details Panel (Bottom Right) --- */
        #details-panel {
            pointer-events: auto;
            text-align: right;
            max-width: 600px;
            align-self: flex-end;
            text-shadow: 0 2px 4px black;
        }

        #selected-title { font-size: 60px; font-weight: 900; margin: 0; line-height: 1; text-transform: uppercase;}
        #selected-artist { font-size: 24px; color: var(--p); margin-bottom: 20px; font-weight: 300;}

        .stats-grid {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            margin-bottom: 30px;
        }

        .stat-box { text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: var(--s); display: block;}
        .stat-label { font-size: 12px; color: #ccc; text-transform: uppercase; letter-spacing: 1px;}

        /* --- Settings Panel --- */
        #settings-box {
            background: rgba(0,0,0,0.8);
            border: 1px solid #444;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: left;
            backdrop-filter: blur(20px);
        }
        
        .setting-row {
            margin-bottom: 15px;
        }
        
        .setting-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #ddd;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--s);
        }

        input[type="color"] {
            background: none;
            border: 1px solid white;
            width: 40px;
            height: 25px;
            cursor: pointer;
        }

        /* --- Buttons --- */
        .btn-play {
            background: var(--p);
            color: black;
            border: none;
            padding: 15px 60px;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            transition: 0.2s;
        }

        .btn-play:hover {
            transform: scale(1.05);
            background: white;
            box-shadow: 0 0 30px var(--p);
        }

        /* --- Scores --- */
        .score-history {
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #333;
            padding-top: 5px;
        }
    </style>
</head>

<body>

    <div id="preview-layer">
        <div id="yt-placeholder"></div>
    </div>

    <div id="sidebar">
        <h1>Select Chart</h1>
        <div id="chart-list">
            <!-- Items injected via JS -->
        </div>

        <div id="settings-box">

            <div class="setting-row">

                    <span id="speed-val">1.0x</span>

                </div>
                <div>

                    <input type="color" id="opt-c2" value="#ff96d3">

                <div>

                    <input type="color" id="opt-c3" value="#ff4444">
                </div>
            </div>
        </div>
    </div>

                <div class="stat-box">
                    <span class="stat-val" id="stat-score">--</span>
                    <span class="stat-label">Best Rank</span>
                </div>
            </div>

            <button class="btn-play" onclick="launchGame()">Start</button>
        </div>
    </div>

        // Helper to make dummy notes for testing
        function generateDummyNotes(bpm, durationSec, density) {
            const arr = [];
            const totalBeats = (bpm / 60) * durationSec;
            for (let i = 4; i < totalBeats; i += (4/density)) {
                if(Math.random() > 0.8) continue; // add gaps
                const type = Math.random() > 0.9 ? 2 : (Math.random() > 0.5 ? 1 : 0);
                // Simple pattern generation
                let row = 1 + Math.floor(Math.random()*3); // 1, 2, 3
                let col = 1 + Math.floor(Math.random()*3);
                arr.push({ beat: i, col: col, row: row, type: type });
            }
            return arr;
        }

        // --- 2. LOGIC ---

        let selectedChartIndex = -1;
        let ytPlayer = null;
        let fadeInterval = null;

        // Settings References
        const sSpeed = document.getElementById('opt-speed');
        const sDist = document.getElementById('opt-dist');
        const sC1 = document.getElementById('opt-c1');
        const sC2 = document.getElementById('opt-c2');
        const sC3 = document.getElementById('opt-c3');

        // Update Labels on input
        sSpeed.addEventListener('input', (e) => document.getElementById('speed-val').innerText = e.target.value + "x");
        sDist.addEventListener('input', (e) => document.getElementById('dist-val').innerText = e.target.value);

        // Load Youtube API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-placeholder', {
                height: '100%', width: '100%',
                playerVars: { 'autoplay': 0, 'controls': 0, 'showinfo': 0, 'mute': 1 },
                events: {
                    'onReady': () => { console.log("YT Ready"); }
                }
            });
        }

        function calculateDifficulty(chart) {
            // Logic: Density (Notes per Second) + Duration factor
            const lastNote = chart.notes[chart.notes.length-1].beat;
            const duration = lastNote * (60 / chart.bpm);
            const count = chart.notes.length;
            const nps = count / duration;

            // Base calculation
            let rating = nps * 1.5; 
            // Length penalty (stamina)
            if(duration > 120) rating *= 1.1;
            if(duration > 240) rating *= 1.2;

            let label = "NORMAL";
            let color = "#78b7ff";

            if(rating < 2) { label = "EASY"; color = "#00ffcc"; }
            else if(rating < 4) { label = "NORMAL"; color = "#78b7ff"; }
            else if(rating < 7) { label = "HARD"; color = "#ffd700"; }
            else if(rating < 10) { label = "EXPERT"; color = "#ff96d3"; }
            else { label = "MASTER"; color = "#ff4444"; }

            return { val: rating.toFixed(1), label, color, duration, count };
        }

        function renderList() {
            const container = document.getElementById('chart-list');
            container.innerHTML = "";

            charts.forEach((chart, index) => {
                const diff = calculateDifficulty(chart);
                
                const card = document.createElement('div');
                card.className = 'chart-card';
                card.onclick = () => selectChart(index);
                card.onmouseenter = () => hoverChart(index);
                card.onmouseleave = () => stopPreview();

                // Mock Score History
                const savedScore = localStorage.getItem(`score_${chart.id}`) || "No Play";

                card.innerHTML = `
                    <span class="chart-title">${chart.title}</span>
                    <div class="chart-artist">${chart.artist}</div>
                    <div class="chart-meta">
                        <span class="diff-tag" style="background:${diff.color}">${diff.label}</span>
                        <span>BPM: ${chart.bpm}</span>
                        <span>${Math.floor(diff.duration/60)}:${Math.floor(diff.duration%60).toString().padStart(2,'0')}</span>
                    </div>
                    <div class="score-history">Best: ${savedScore}</div>
                `;
                container.appendChild(card);
            });
        }

        function selectChart(index) {
            selectedChartIndex = index;
            const chart = charts[index];
            const diff = calculateDifficulty(chart);

            // Highlight in UI
            document.querySelectorAll('.chart-card').forEach((c, i) => {
                c.style.borderLeftColor = (i === index) ? 'var(--p)' : '#444';
                c.style.background = (i === index) ? 'rgba(60,60,70,0.9)' : '';
            });

            // Update Details
            document.getElementById('details-panel').style.display = 'block';
            document.getElementById('selected-title').innerText = chart.title;
            document.getElementById('selected-artist').innerText = chart.artist;
            document.getElementById('stat-notes').innerText = diff.count;
            document.getElementById('stat-bpm').innerText = chart.bpm;
            
            const diffEl = document.getElementById('stat-diff');
            diffEl.innerText = diff.label;
            diffEl.style.color = diff.color;
            
            const score = localStorage.getItem(`score_${chart.id}`);
            document.getElementById('stat-score').innerText = score ? "S" : "-"; // Placeholder logic
        }

        function hoverChart(index) {
            if(!ytPlayer || !ytPlayer.loadVideoById) return;
            const chart = charts[index];
            
            // Calculate 25% timestamp or use defined previewTime
            const lastNoteBeat = chart.notes[chart.notes.length-1].beat;
            const duration = lastNoteBeat * (60/chart.bpm);
            const startT = chart.previewTime || (duration * 0.25);

            ytPlayer.loadVideoById(chart.youtubeId, startT);
            ytPlayer.setVolume(0);
            
            // Smooth fade in
            clearInterval(fadeInterval);
            let vol = 0;
            fadeInterval = setInterval(() => {
                vol += 5;
                if(vol >= 50) clearInterval(fadeInterval);
                ytPlayer.setVolume(vol);
            }, 100);

            document.getElementById('preview-layer').style.opacity = 1.0;
        }

        function stopPreview() {
            // Optional: You might want to keep playing the selected chart,
            // but for now let's just dim it or pause it.
            // For a cool menu, usually we keep it playing if selected, 
            // but since we separate selection and hover, let's just fade out.
            
            if(!ytPlayer) return;
            
            clearInterval(fadeInterval);
            ytPlayer.pauseVideo();
            document.getElementById('preview-layer').style.opacity = 0.3;
        }

        function launchGame() {
            if(selectedChartIndex === -1) return;

            const baseChart = charts[selectedChartIndex];
            
            // We need to inject the settings into the chart object or a separate config
            // Since the Player Client code reads 'selectedChart', we will modify the chart object
            // to include our settings, BUT the player needs to know how to read them.
            // *Fix*: The prompt's player has hardcoded CONFIG. 
            // To make this work without changing player code logic too much, 
            // we will overwrite specific keys if the player supported it, 
            // OR we rely on the player code in the previous prompt being editable.
            
            // Assuming we are just saving data for the provided Player Client:
            // We will modify the note colors in the source array? No, that's complex.
            // We will attach an 'overrides' object.
            
            const finalData = {
                ...baseChart,
                // Inject settings into the JSON. 
                // The provided Player Client uses CONFIG.colors and CONFIG.approachDistance.
                // We'll add a specific key 'clientConfig' that a modified player could read,
                // OR we accept that the standard player won't read these unless updated.
                // However, the prompt asks to "add settings for..." implies functional settings.
                
                // HACK: We can't change the player code in the prompt, but we can pass the data.
                // If you use the chart in the player, you should add:
                // `if(data.settings) { Object.assign(CONFIG, data.settings); }`
                settings: {
                    colors: [sC1.value, sC2.value, sC3.value], // Left, Right, Wall
                    approachDistance: parseInt(sDist.value),
                    speedMultiplier: parseFloat(sSpeed.value) // Player uses baseSpeed, we'll need to multiply
                }
            };
            
            // To make the speed setting work with the *existing* player logic:
            // The player calculates visual distance based on speed events. 
            // It has `STATE.baseSpeed`. We can try to modify the event values or baseSpeed logic.
            // The easiest way for the user is if we modify the Player Client to check `data.settings`.

            localStorage.setItem('selectedChart', JSON.stringify(finalData));
            
            // Navigate to player
            // Assuming player is in same directory named 'player.html'
            // or we just document.write the player code (not recommended).
            window.location.href = './player'; 
        }

        renderList();

    </script>
