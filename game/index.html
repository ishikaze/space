<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Select Chart</title>
    <style>
        :root {
            --p: #ff96d3;
            --s: #78b7ff;
            --bg: #050505;
            --card-bg: rgba(20, 20, 20, 0.85);
            --glass: blur(10px);
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        #input-blocker {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: opacity 0.5s;
        }

        #input-blocker h1 {
            font-size: 40px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        #preview-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
            transition: opacity 0.5s;
            filter: grayscale(0.5);
        }

        #sidebar {
            width: 450px;
            background: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: var(--glass);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        #main-area {
            flex: 1;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            pointer-events: none;
        }

        h1 {
            color: var(--s);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 15px var(--s);
            margin-bottom: 30px;
        }

        #chart-list {
            overflow-y: auto;
            flex: 1;
            padding-right: 10px;
        }

        .song-card {
            background: var(--card-bg);
            border-left: 4px solid #444;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .song-card:hover, .song-card.active {
            background: rgba(40, 40, 50, 0.9);
            border-left-color: var(--p);
            transform: translateX(10px);
            box-shadow: 0 0 20px rgba(255, 150, 211, 0.2);
        }

        .chart-title {
            font-size: 18px;
            font-weight: bold;
            display: block;
        }

        .chart-artist {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .diff-badges {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .mini-tag {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        #details-panel {
            pointer-events: auto;
            text-align: right;
            max-width: 600px;
            align-self: flex-end;
            text-shadow: 0 2px 4px black;
        }

        #selected-title { font-size: 60px; font-weight: 900; margin: 0; line-height: 1; text-transform: uppercase;}
        #selected-artist { font-size: 24px; color: var(--p); margin-bottom: 20px; font-weight: 300;}

        #diff-selector {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .diff-btn {
            background: rgba(0,0,0,0.6);
            border: 1px solid #555;
            color: #888;
            padding: 8px 16px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .diff-btn:hover { background: #333; }
        
        .diff-btn.active {
            background: white;
            color: black;
            border-color: white;
            box-shadow: 0 0 15px white;
            transform: scale(1.1);
        }

        .stats-grid {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            margin-bottom: 30px;
        }

        .stat-box { text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: var(--s); display: block;}
        .stat-label { font-size: 12px; color: #ccc; text-transform: uppercase; letter-spacing: 1px;}

        #settings-box {
            background: rgba(0,0,0,0.8);
            border: 1px solid #444;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: left;
            backdrop-filter: blur(20px);
        }
        
        .setting-row { margin-bottom: 15px; }
        .setting-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #ddd;
            margin-bottom: 5px;
        }

        input[type="range"] { width: 100%; accent-color: var(--s); }
        input[type="color"] {
            background: none; border: 1px solid white;
            width: 40px; height: 25px; cursor: pointer;
        }

        .btn-play {
            background: var(--p);
            color: black;
            border: none;
            padding: 15px 60px;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            transition: 0.2s;
        }

        .btn-play:hover {
            transform: scale(1.05);
            background: white;
            box-shadow: 0 0 30px var(--p);
        }

        .score-history {
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #333;
            padding-top: 5px;
        }
    </style>
</head>

<body>

    <div id="input-blocker" onclick="unlockSite()">
        <h1 style="color:var(--p)">CLICK TO CONTINUE</h1>
        <p style="color:#aaa; text-transform: uppercase; letter-spacing: 2px;">Enable Audio & Video Preview</p>
    </div>

    <div id="preview-layer">
        <div id="yt-placeholder"></div>
    </div>

    <div id="sidebar">
        <h1>Select Chart</h1>
        <div id="chart-list">
        </div>

        <div id="settings-box">
            <h3 style="margin-top:0; color:var(--s);">Game Settings</h3>
            
            <div class="setting-row">
                <div class="setting-label">
                    <span>Speed Multiplier</span>
                    <span id="speed-val">1.0x</span>
                </div>
                <input type="range" id="opt-speed" min="0.1" max="5.0" step="0.1" value="1.0">
            </div>

            <div class="setting-row">
                <div class="setting-label">
                    <span>Note Distance</span>
                    <span id="dist-val">8000</span>
                </div>
                <input type="range" id="opt-dist" min="2000" max="15000" step="500" value="8000">
            </div>

            <div class="setting-row" style="display:flex; justify-content:space-between;">
                <div>
                    <div style="font-size:12px; margin-bottom:4px;">Left</div>
                    <input type="color" id="opt-c1" value="#78b7ff">
                </div>
                <div>
                    <div style="font-size:12px; margin-bottom:4px;">Right</div>
                    <input type="color" id="opt-c2" value="#ff96d3">
                </div>
                <div>
                    <div style="font-size:12px; margin-bottom:4px;">Obstacle</div>
                    <input type="color" id="opt-c3" value="#ff4444">
                </div>
            </div>
        </div>
    </div>

    <div id="main-area">
        <div id="details-panel" style="display:none;">
            <h2 id="selected-title">Title</h2>
            <div id="selected-artist">Artist</div>

            <div id="diff-selector"></div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-val" id="stat-diff">NORMAL</span>
                    <span class="stat-label">Difficulty</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val" id="stat-notes">0</span>
                    <span class="stat-label">Notes</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val" id="stat-bpm">0</span>
                    <span class="stat-label">BPM</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val" id="stat-score">--</span>
                    <span class="stat-label">Best Rank</span>
                </div>
            </div>

            <button class="btn-play" onclick="launchGame()">Start</button>
        </div>
    </div>

    <script src="./charts.js"></script>

    <script>
        let ytPlayer = null;
        let fadeInterval = null;
        let currentVideoId = null; 
        let interactionAllowed = false;
        
        let groupedCharts = {};
        let selectedYoutubeId = null; 
        let selectedVariantIndex = 0; 

        const sSpeed = document.getElementById('opt-speed');
        const sDist = document.getElementById('opt-dist');
        const sC1 = document.getElementById('opt-c1');
        const sC2 = document.getElementById('opt-c2');
        const sC3 = document.getElementById('opt-c3');

        if(localStorage.getItem('opt-speed')) {
            sSpeed.value = localStorage.getItem('opt-speed');
            document.getElementById('speed-val').innerText = sSpeed.value + "x";
        }
        if(localStorage.getItem('opt-dist')) {
            sDist.value = localStorage.getItem('opt-dist');
            document.getElementById('dist-val').innerText = sDist.value;
        }
        if(localStorage.getItem('opt-c1')) sC1.value = localStorage.getItem('opt-c1');
        if(localStorage.getItem('opt-c2')) sC2.value = localStorage.getItem('opt-c2');
        if(localStorage.getItem('opt-c3')) sC3.value = localStorage.getItem('opt-c3');

        sSpeed.addEventListener('input', (e) => {
            document.getElementById('speed-val').innerText = e.target.value + "x";
            localStorage.setItem('opt-speed', e.target.value);
        });
        
        sDist.addEventListener('input', (e) => {
            document.getElementById('dist-val').innerText = e.target.value;
            localStorage.setItem('opt-dist', e.target.value);
        });

        sC1.addEventListener('input', (e) => localStorage.setItem('opt-c1', e.target.value));
        sC2.addEventListener('input', (e) => localStorage.setItem('opt-c2', e.target.value));
        sC3.addEventListener('input', (e) => localStorage.setItem('opt-c3', e.target.value));

        function unlockSite() {
            interactionAllowed = true;
            document.getElementById('input-blocker').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('input-blocker').style.display = 'none';
            }, 500);
            
            if(!ytPlayer && window.YT) onYouTubeIframeAPIReady();
        }

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-placeholder', {
                height: '100%', 
                width: '100%',
                playerVars: { 
                    'autoplay': 0, 
                    'controls': 0, 
                    'showinfo': 0, 
                    'mute': 1, 
                    'loop': 1,
                    'origin': window.location.origin 
                },
                events: {
                    'onReady': () => { }
                }
            });
        }

        function calculateDifficulty(chart) {
            const lastNote = chart.notes[chart.notes.length-1].beat;
            const duration = lastNote * (60 / chart.bpm);
            const count = chart.notes.length;
            const nps = count / duration;

            let rating = nps * 1.5; 
            if(duration > 120) rating *= 1.1;

            let label = "Unrated";
            let color = "#78b7ff";

            if(rating < 2) { label = "Relaxed"; color = "#00ffcc"; }
            else if(rating < 4) { label = "Casual"; color = "#78b7ff"; }
            else if(rating < 7) { label = "Hard"; color = "#ffd700"; }
            else if(rating < 10) { label = "Expert"; color = "#ff4444"; }
            else { label = "Lunatic"; color = "#c68cff"; }

            return { val: rating.toFixed(1), label, color, duration, count };
        }

        function processGroups() {
            groupedCharts = {};
            charts.forEach(c => {
                const vid = c.youtubeId;
                if(!groupedCharts[vid]) groupedCharts[vid] = [];
                groupedCharts[vid].push(c);
            });

            for(let vid in groupedCharts) {
                groupedCharts[vid].sort((a,b) => a.notes.length - b.notes.length);
            }
        }

        function renderList() {
            processGroups();
            const container = document.getElementById('chart-list');
            container.innerHTML = "";

            Object.keys(groupedCharts).forEach(vid => {
                const group = groupedCharts[vid];
                const baseChart = group[0]; 
                
                const card = document.createElement('div');
                card.className = 'song-card';
                card.dataset.vid = vid;
                
                card.onclick = () => selectSongGroup(vid);
                card.onmouseenter = () => hoverSong(vid);

                let badgesHTML = "";
                group.forEach(gChart => {
                    const d = calculateDifficulty(gChart);
                    badgesHTML += `<span class="mini-tag" style="background:${d.color}" title="${d.label}"></span>`;
                });

                card.innerHTML = `
                    <span class="chart-title">${baseChart.title}</span>
                    <div class="chart-artist">${baseChart.artist}</div>
                    <div class="diff-badges">${badgesHTML}</div>
                `;
                container.appendChild(card);
            });
        }

        function hoverSong(vid) {
            if(!interactionAllowed || !ytPlayer || !ytPlayer.loadVideoById) return;
            if(currentVideoId === vid) return; 

            currentVideoId = vid;
            const group = groupedCharts[vid];
            const baseChart = group[0];
            
            const lastNoteBeat = baseChart.notes[baseChart.notes.length-1].beat;
            const duration = lastNoteBeat * (60/baseChart.bpm);
            const startT = baseChart.previewTime || (duration * 0.25);

            ytPlayer.setVolume(0);
            ytPlayer.loadVideoById(baseChart.youtubeId, startT);
            
            clearInterval(fadeInterval);
            let vol = 0;
            fadeInterval = setInterval(() => {
                vol += 2; 
                if(vol >= 50) {
                    vol = 50;
                    ytPlayer.setVolume(vol);
                    clearInterval(fadeInterval);
                } else {
                    ytPlayer.setVolume(vol);
                }
            }, 50);

            document.getElementById('preview-layer').style.opacity = 1.0;
        }

        function selectSongGroup(vid) {
            selectedYoutubeId = vid;
            selectedVariantIndex = 0;
            
            document.querySelectorAll('.song-card').forEach(c => {
                if(c.dataset.vid === vid) {
                    c.style.borderLeftColor = 'var(--p)';
                    c.style.background = 'rgba(60,60,70,0.9)';
                } else {
                    c.style.borderLeftColor = '#444';
                    c.style.background = '';
                }
            });

            hoverSong(vid);
            updateDetailsPanel();
        }

        function updateDetailsPanel() {
            const group = groupedCharts[selectedYoutubeId];
            const chart = group[selectedVariantIndex];
            
            document.getElementById('details-panel').style.display = 'block';
            document.getElementById('selected-title').innerText = chart.title;
            document.getElementById('selected-artist').innerText = chart.artist;

            const diffContainer = document.getElementById('diff-selector');
            diffContainer.innerHTML = "";
            
            group.forEach((v, idx) => {
                const d = calculateDifficulty(v);
                const btn = document.createElement('button');
                btn.className = 'diff-btn';
                if(idx === selectedVariantIndex) {
                    btn.classList.add('active');
                    btn.style.color = d.color;
                    btn.style.borderColor = d.color;
                    btn.style.boxShadow = `0 0 10px ${d.color}`;
                }
                btn.innerText = d.label;
                btn.onclick = () => {
                    selectedVariantIndex = idx;
                    updateDetailsPanel(); 
                };
                diffContainer.appendChild(btn);
            });

            const diff = calculateDifficulty(chart);
            document.getElementById('stat-notes').innerText = diff.count;
            document.getElementById('stat-bpm').innerText = chart.bpm;
            
            const diffEl = document.getElementById('stat-diff');
            diffEl.innerText = diff.label;
            diffEl.style.color = diff.color;
            
            const score = localStorage.getItem(`score_${chart.id}`);
            document.getElementById('stat-score').innerText = score ? "S" : "-";
        }

        function launchGame() {
            if(!selectedYoutubeId) return;

            const group = groupedCharts[selectedYoutubeId];
            const baseChart = group[selectedVariantIndex];
            
            const finalData = {
                ...baseChart,
                settings: {
                    colors: [sC1.value, sC2.value, sC3.value], 
                    approachDistance: parseInt(sDist.value),
                    speedMultiplier: parseFloat(sSpeed.value)
                }
            };

            localStorage.setItem('selectedChart', JSON.stringify(finalData));
            window.location.href = './player'; 
        }

        renderList();

    </script>
</body>
</html>
