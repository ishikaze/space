<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Added viewport meta tag for mobile scaling and disable zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>player client v7(16) Mobile</title>
    <style>
        @font-face {
        font-family: 'twos'; /* Choose a name */
        src: url('../../assets/fonts/Two\ Slice.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        }

        @font-face {
        font-family: '3x3'; /* Choose a name */
        src: url('../../assets/fonts/3x3.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        }

        :root {
            --p: #ff96d3;
            --s: #78b7ff;
            --gold: #ffd700;
            --auto: #00ffcc;
            --playfield-op: 1.0;
            --bg-dim: 0.5;
            --bloom-blur: 0px;
            --bloom-bright: 1.0;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            user-select: none;
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior: none;
            touch-action: none;
        }

        #video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            border: none;
            transform-origin: center center;
            transform: scale(1.1);
            transition: transform 0.05s linear;
        }

        body.game-paused #video-placeholder {
            pointer-events: auto;
        }

        body.game-paused #gameCanvas,
        body.game-paused #bloom-layer,
        body.game-paused #bg-dim-layer {
            pointer-events: none;
        }

        #bg-dim-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: var(--bg-dim);
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.1s linear;
        }

        #gameCanvas {
            position: absolute;
            display: block;
            top: 0;
            left: 0;
            z-index: 5;
            opacity: var(--playfield-op);
            transition: opacity 0.1s;
        }

        #bloom-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            backdrop-filter: blur(var(--bloom-blur)) brightness(var(--bloom-bright));
            transition: backdrop-filter 0.1s linear;
        }

        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: red;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
            transition: opacity 0.1s;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* NEW PAUSE BUTTON STYLE */
        #mobile-pause-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--s);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            display: none; /* Hidden by default, shown in JS during game */
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        #mobile-pause-btn:active {
            background: var(--s);
            color: black;
        }

        .menu-box {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--s);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(120, 183, 255, 0.3);
            display: none;
            max-width: 500px;
            width: 80%;
        }

        .menu-box h1 {
            margin-top: 0;
            color: var(--p);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 32px;
            text-shadow: 0 0 10px var(--p);
        }

        .btn {
            background: transparent;
            color: white;
            border: 2px solid white;
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin: 10px;
            text-transform: uppercase;
        }

        .btn:hover {
            background: white;
            color: black;
            box-shadow: 0 0 15px white;
        }

        .btn-primary {
            border-color: var(--s);
            color: var(--s);
        }

        .btn-primary:hover {
            background: var(--s);
            color: black;
            box-shadow: 0 0 15px var(--s);
        }

        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            width: 100%;
            box-sizing: border-box;
        }

        #countdown {
            position: absolute;
            font-size: 100px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 30px var(--p);
            display: none;
        }

        .loader-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: var(--s);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="video-placeholder"></div>

    <div id="bg-dim-layer"></div>
    <canvas id="gameCanvas"></canvas>
    <div id="bloom-layer"></div>
    <div id="flash-overlay"></div>

    <!-- NEW PAUSE BUTTON -->
    <div id="mobile-pause-btn" onclick="pauseGame()">pause</div>

    <div id="ui-layer">

        <div id="countdown">3</div>
        <div id="menu-main" class="menu-box">
            <h1>player client</h1>
            <div id="loading-status">
                <div class="loader-spinner"></div>
                <p>Initializing YouTube API...</p>
            </div>

            <div id="load-options" style="display:none;">
                <p>No chart found in local storage.</p>
                <input type="file" id="fileInput" accept=".json">
                <p style="font-size: 12px; color: #666;">Or save a chart to localStorage key "selectedChart"</p>
            </div>

            <div id="ready-options" style="display:none;">
                <h2 id="song-info" style="color:white; margin:10px 0;">Unknown Song</h2>
                <button class="btn btn-primary" onclick="startGame()">Start Game</button>
            </div>
        </div>

        <div id="menu-pause" class="menu-box">
            <h1>Paused</h1>
            <div id="pause-stats" style="margin-bottom:20px; font-size:20px;"></div>
            <button class="btn btn-primary" onclick="resumeGame()">Resume</button>
            <button class="btn" onclick="location.href = '../'">Quit</button>
        </div>

        <div id="menu-results" class="menu-box">
            <h1>Finished!</h1>
            <div id="final-score" style="font-size:40px; color:var(--s); margin:20px 0;">0</div>
            <p id="final-stats"></p>
            <button class="btn btn-primary" onclick="location.reload()">Back to Menu</button>
        </div>

    </div>

    <script>
        const CONFIG = {
            gridDim: 3, gridSpacing: 100, fov: 350, approachDistance: 8000, hitZ: 50,
            hitZ: 0,
            cameraZ: 250,
            colors: ['#78b7ff', '#ff96d3', '#ff4444'], 
            startBuffer: 3.0 
        };

        const STATE = {
            status: 'LOADING', 
            offset: 0, baseSpeed: 2500,
            currentTime: 0, duration: 0,
            score: 0, displayedScore: 0, 
            combo: 0, maxCombo: 0, hits: 0, misses: 0,

            lastNoteBeat: 0,
            isFading: false,
            fadeStartTime: 0,

            fever: 30,
            feverMax: 30,
            feverState: 2,
        };

        const UI_ANIM = {
            comboScale: 1.0,
            spaceAlpha: 0.0
        };

        let mapData = [];
        let gameEvents = [];
        let bpmEvents = [{ beat: 0, bpm: 128, time: 0 }]; 
        let ytPlayer; let ytReady = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgVideo = document.getElementById('video-placeholder');
        const pauseBtn = document.getElementById('mobile-pause-btn'); // Ref to new button

        let mouse = { x: 0, y: 0, realX: 0, realY: 0 };
        let camera = { x: 0, y: 0, recoil: 0, shake: 0 };
        let targetCamera = { x: 0, y: 0 };
        let viewShake = { x: 0, y: 0 };
        let particles = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('video-placeholder', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'autoplay': 0, 'controls': 0, 'rel': 0, 'showinfo': 0, 'iv_load_policy': 3, 'disablekb': 1 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady() {
            ytReady = true;
            checkLocalStorageLoad();
        }

        function onPlayerStateChange(e) {
            if (e.data === YT.PlayerState.ENDED && STATE.status === 'PLAYING' && !STATE.isFading) {
                finishGame();
            }
        }

        function updateBPMCache() {
            bpmEvents.sort((a, b) => a.beat - b.beat);
            if (bpmEvents.length === 0 || bpmEvents[0].beat !== 0) {
                bpmEvents.unshift({ beat: 0, bpm: 128, time: 0 });
            }
            bpmEvents[0].time = 0; 

            for (let i = 0; i < bpmEvents.length - 1; i++) {
                const curr = bpmEvents[i];
                const next = bpmEvents[i+1];
                const beatsDiff = next.beat - curr.beat;
                const secondsDiff = beatsDiff * (60 / curr.bpm);
                next.time = curr.time + secondsDiff;
            }
        }

        function timeToBeat(time) {
            if (time <= 0) return 0;
            let evt = bpmEvents[0];
            for (let i = 0; i < bpmEvents.length; i++) {
                if (time >= bpmEvents[i].time) evt = bpmEvents[i];
                else break;
            }
            return evt.beat + (time - evt.time) * (evt.bpm / 60);
        }

        function checkLocalStorageLoad() {
            const statusDiv = document.getElementById('loading-status');
            const storedChart = localStorage.getItem('selectedChart');

            if (storedChart) {
                try {
                    const data = JSON.parse(storedChart);
                    loadMapData(data);
                    statusDiv.style.display = 'none';
                    startGame()
                } catch (e) {
                    console.error("LS Load Failed", e);
                    promptManualLoad();
                }
            } else {
                promptManualLoad();
            }
        }

        function promptManualLoad() {
            document.getElementById('loading-status').style.display = 'none';
            document.getElementById('load-options').style.display = 'block';
            document.getElementById('menu-main').style.display = 'block';

            document.getElementById('fileInput').addEventListener('change', (e) => {
                const f = e.target.files[0];
                if (!f) return;
                const r = new FileReader();
                r.onload = ev => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        loadMapData(d);
                        document.getElementById('load-options').style.display = 'none';
                        document.getElementById('ready-options').style.display = 'block';
                        document.getElementById('song-info').innerText = f.name.replace('.json', '');
                    } catch (err) { alert("Invalid JSON file"); }
                };
                r.readAsText(f);
            });
        }

        function loadMapData(data) {
            if (data.bpm && Array.isArray(data.bpm)) {
                bpmEvents = data.bpm;
            } else {
                bpmEvents = [{ beat: 0, bpm: data.bpm || 128, time: 0 }];
            }
            updateBPMCache();

            STATE.offset = (data.offset || 0) + 75; 
            mapData = data.notes.map(n => ({ ...n, hit: false, missed: false }));

            STATE.lastNoteBeat = 0;
            mapData.forEach(n => {
                if (n.beat > STATE.lastNoteBeat) STATE.lastNoteBeat = n.beat;
            });

            if (data.speedEvents && !data.events) {
                gameEvents = data.speedEvents.map(s => ({ beat: s.beat, type: 'speed', value: (s.mult || s.val / 800) }));
                gameEvents.push(
                    { beat: 0, type: 'bg-dim', value: 0.5 },
                    { beat: 0, type: 'playfield-op', value: 1.0 },
                    { beat: 0, type: 'bloom-blur', value: 0 },
                    { beat: 0, type: 'bloom-bright', value: 1.0 }
                );
            } else if (data.events) {
                gameEvents = data.events;
            } else {
                gameEvents = [{ beat: 0, type: 'speed', value: 1 }];
            }

            if (data.youtubeId && ytReady) {
                ytPlayer.loadVideoById(data.youtubeId);
                ytPlayer.pauseVideo();
            }
            
            if (data.settings) {
                if (data.settings.colors) CONFIG.colors = data.settings.colors;
                if (data.settings.approachDistance) CONFIG.approachDistance = data.settings.approachDistance;
                if (data.settings.speedMultiplier) {
                    STATE.baseSpeed = 2500 * data.settings.speedMultiplier;
                }
            }
        }
    

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            STATE.status = 'PLAYING';
            STATE.score = 0; STATE.displayedScore = 0;
            STATE.combo = 0; STATE.maxCombo = 0; STATE.hits = 0; STATE.misses = 0;
            STATE.fever = 30; STATE.feverState = 0;
            STATE.isFading = false;

            document.querySelectorAll('.menu-box').forEach(el => el.style.display = 'none');
            mapData.forEach(n => { n.hit = false; n.missed = false; });

            resize();
            
            // Try pointer lock, but don't crash if it fails (Mobile)
            try { canvas.requestPointerLock(); } catch(e){}
            
            pauseBtn.style.display = 'flex'; // Show mobile pause button

            mouse.realX = canvas.width / 2; mouse.realY = canvas.height / 2;

            STATE.currentTime = -CONFIG.startBuffer;
            if (ytReady) {
                ytPlayer.seekTo(0);
                ytPlayer.pauseVideo();
                ytPlayer.setVolume(100);
            }
        }

        function resumeGame() {
            if (STATE.status !== 'PAUSED') return;
            document.body.classList.remove('game-paused');
            try { canvas.requestPointerLock(); } catch(e){}
            STATE.status = 'PLAYING';
            document.getElementById('menu-pause').style.display = 'none';
            pauseBtn.style.display = 'flex'; // Show mobile pause button

            if (STATE.currentTime >= 0 && ytReady) {
                ytPlayer.seekTo(STATE.currentTime);
                ytPlayer.playVideo();
            }
        }

        function pauseGame() {
            if (STATE.status !== 'PLAYING') return;
            STATE.status = 'PAUSED';
            document.exitPointerLock();
            if (ytReady) ytPlayer.pauseVideo();
            
            pauseBtn.style.display = 'none'; // Hide mobile pause button (menu covers it)

            document.body.classList.add('game-paused');
            document.getElementById('menu-pause').style.display = 'block';
            document.getElementById('pause-stats').innerHTML = `
                Current Score: ${Math.floor(STATE.displayedScore).toLocaleString()}<br>
                <span style="font-size:14px; color:#aaa; margin-top:5px; display:block;">
                    (Click video background to Skip Ads)
                </span>`;
        }

        function finishGame() {
            STATE.status = 'FINISHED';
            document.exitPointerLock();
            pauseBtn.style.display = 'none';

            // 1. Gather Results
            const results = {
                score: Math.floor(STATE.score),
                combo: STATE.maxCombo,
                hits: STATE.hits,
                misses: STATE.misses
            };

            // 2. Save to LocalStorage
            localStorage.setItem('gameResults', JSON.stringify(results));

            // 3. Redirect to Results Screen
            window.location.href = '../';
        }


        window.addEventListener('resize', resize);

        document.addEventListener('keydown', e => {
            if (e.code === 'Escape') {
                if (STATE.status === 'PLAYING') pauseGame();
                else if (STATE.status === 'PAUSED') resumeGame();
            }
            if (e.code === 'Space' && STATE.status === 'PLAYING') {
                if (STATE.feverState === 0) {
                    activateAutoMode();
                } else if (STATE.feverState === 2) {
                    STATE.feverState = 0;
                }
            }
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === null && STATE.status === 'PLAYING') {
                // On PC this pauses, on mobile we ignore this because lock isn't supported
                // Check if user is on mobile by checking touch capability roughly
                const isTouch = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0));
                if(!isTouch) pauseGame();
            }
        });

        // --- NEW MOBILE TOUCH HANDLERS ---
        canvas.addEventListener('touchstart', handleTouch, {passive: false});
        canvas.addEventListener('touchmove', handleTouch, {passive: false});

        function handleTouch(e) {
            e.preventDefault(); // Stop scrolling
            if (STATE.status !== 'PLAYING') return;

            const touch = e.touches[0];
            
            // Map touch position directly to game cursor (1:1 control)
            mouse.realX = touch.clientX;
            mouse.realY = touch.clientY;

            // Ensure bounds
            mouse.realX = Math.max(0, Math.min(canvas.width, mouse.realX));
            mouse.realY = Math.max(0, Math.min(canvas.height, mouse.realY));

            // Update projection coordinates
            mouse.x = (mouse.realX - canvas.width / 2) / (canvas.width / 2);
            mouse.y = (mouse.realY - canvas.height / 2) / (canvas.height / 2);
        }
        // ---------------------------------

        window.addEventListener('mousemove', e => {
            if (STATE.feverState === 2) return;

            if (document.pointerLockElement === canvas) {
                const fieldSize = (CONFIG.gridDim * CONFIG.gridSpacing) / 2;
                const p1 = project(-fieldSize, -fieldSize, CONFIG.hitZ, camera.x, camera.y);
                const p2 = project(fieldSize, fieldSize, CONFIG.hitZ, camera.x, camera.y);
                const minX = Math.min(p1.x, p2.x); const maxX = Math.max(p1.x, p2.x);
                const minY = Math.min(p1.y, p2.y); const maxY = Math.max(p1.y, p2.y);

                mouse.realX += e.movementX;
                mouse.realY += e.movementY;

                const cursorSize = 40; 
                const pad = cursorSize / 2; 

                if (mouse.realX < minX + pad) mouse.realX = minX + pad;
                if (mouse.realX > maxX - pad) mouse.realX = maxX - pad;
                if (mouse.realY < minY + pad) mouse.realY = minY + pad;
                if (mouse.realY > maxY - pad) mouse.realY = maxY - pad;

                mouse.x = (mouse.realX - canvas.width / 2) / (canvas.width / 2);
                mouse.y = (mouse.realY - canvas.height / 2) / (canvas.height / 2);

            } else if (STATE.status !== 'PLAYING') {
                mouse.realX = e.clientX;
                mouse.realY = e.clientY;
            }
        });

        function playHitSound() {
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            g.gain.setValueAtTime(0.3, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }
        function playFailSound() {
            const osc = audioCtx.createOscillator(); const g = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            g.gain.setValueAtTime(0.4, audioCtx.currentTime); g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function activateAutoMode() {
            STATE.feverState = 2;
        }


        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (STATE.status !== 'PLAYING') {
                mouse.realX = canvas.width / 2;
                mouse.realY = canvas.height / 2;
            }
        }

        function project(x, y, z, cx, cy) {
            let renderZ = z - CONFIG.cameraZ;
            let effectiveZ = renderZ + camera.recoil;
            if (effectiveZ < 1) effectiveZ = 1;

            const scale = CONFIG.fov / (effectiveZ + CONFIG.fov);

            return {
                x: ((x - cx) * scale) + canvas.width / 2 + viewShake.x,
                y: -((y - cy) * scale) + canvas.height / 2 + viewShake.y,
                scale: scale
            };
        }

        function getInterpolatedValue(beat, type) {
            const evs = gameEvents.filter(e => e.type === type).sort((a, b) => a.beat - b.beat);
            if (evs.length === 0) {
                if (type === 'speed' || type === 'playfield-op' || type === 'bloom-bright') return 1.0;
                return 0.0;
            }
            if (beat <= evs[0].beat) return evs[0].value;
            if (beat >= evs[evs.length - 1].beat) return evs[evs.length - 1].value;

            for (let i = 0; i < evs.length - 1; i++) {
                if (beat >= evs[i].beat && beat < evs[i + 1].beat) {
                    const start = evs[i]; const end = evs[i + 1];
                    if (type === 'speed') return start.value;
                    const progress = (beat - start.beat) / (end.beat - start.beat);
                    return start.value + (end.value - start.value) * progress;
                }
            }
            return evs[0].value;
        }

        function getVisualDistance(currentBeat, noteBeat) {
            if (noteBeat < currentBeat) return -getVisualDistance(noteBeat, currentBeat);
            let dist = 0; let cursor = currentBeat;
            const speeds = gameEvents.filter(e => e.type === 'speed').sort((a, b) => a.beat - b.beat);
            let activeEvents = speeds.filter(e => e.beat > cursor && e.beat < noteBeat);
            let currentMult = getInterpolatedValue(cursor, 'speed');

            for (let e of activeEvents) {
                dist += (e.beat - cursor) * STATE.baseSpeed * currentMult;
                cursor = e.beat; currentMult = e.value;
            }
            dist += (noteBeat - cursor) * STATE.baseSpeed * currentMult;
            return dist;
        }

        function doHit(x, y, z, c) {
            camera.recoil = Math.min(camera.recoil + 50, 150);
            camera.shake = Math.min(camera.shake + 7, 15);

            STATE.hits++;
            STATE.combo++;
            UI_ANIM.comboScale = 1.5;
            if (STATE.combo > STATE.maxCombo) STATE.maxCombo = STATE.combo;

            let multiplier = (STATE.feverState === 1) ? 2 : 1;
            STATE.score += (100 + (STATE.combo * 10)) * multiplier;

            if (STATE.feverState !== 2) {
                if (STATE.fever < STATE.feverMax) {
                    STATE.fever = 30;
                    if (STATE.fever >= STATE.feverMax && STATE.feverState === 0) {
                        STATE.feverState = 1;
                    }
                }
            }

            playHitSound();
            for (let i = 0; i < 12; i++) particles.push({ x, y, z, c, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, vz: (Math.random() - 0.5) * 20, life: 1 });
        }

        function handleMiss() {
            STATE.misses++;
            STATE.combo = 0;
            if (STATE.feverState !== 2) {
                STATE.fever = Math.max(0, STATE.fever - 0);
            }
        }

function drawHUD() {
            const boxHalf = (CONFIG.gridDim * CONFIG.gridSpacing) / 2;
            const z = CONFIG.hitZ;
            const pTopLeft = project(-boxHalf, boxHalf, z, camera.x, camera.y);
            
            // Visual Bottom Center Edge (0, -y)
            const pBotCenter = project(0, -boxHalf, z, camera.x, camera.y);
            
            const scale = pTopLeft.scale;

            // --- SCORE (Top Left) ---
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom'; // Draw upwards from the anchor point
            ctx.font = `bold ${30 * scale}px "3x3"`;
            ctx.letterSpacing = '-2px';
            ctx.shadowBlur = 10; ctx.shadowColor = 'var(--s)'; ctx.fillStyle = 'white';
            // Draw slightly above the corner
            ctx.fillText(Math.floor(STATE.displayedScore), pTopLeft.x, pTopLeft.y - (10 * scale));

            // --- COMBO (Right Side) ---
            const pRight = project(boxHalf, 0, z, camera.x, camera.y);
            const r = 50 * scale;

            ctx.save();
            ctx.translate(pRight.x + (r + 10 * scale), pRight.y);

            ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 4 * scale; ctx.stroke();

            const startAngle = -Math.PI / 2;
            const endAngle = startAngle + (Math.PI * 2 * (STATE.fever / STATE.feverMax));
            let color = '#fff';
            if (STATE.feverState === 1) color = '#ffd700';
            else if (STATE.feverState === 2) color = '#00ffcc';

            ctx.beginPath(); ctx.arc(0, 0, r, startAngle, endAngle);
            ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 15;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.fillStyle = color; ctx.textBaseline = 'middle';
            ctx.font = `900 ${24 * scale * UI_ANIM.comboScale}px "3x3"`;
            ctx.shadowBlur = 0;
            ctx.fillText(STATE.combo, 0, 0);

            ctx.font = `bold ${12 * scale}px "3x3"`;
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText("COMBO", 0, 20 * scale);
            ctx.restore();

            // --- 2X MULTIPLIER (Left Side) ---
            if (STATE.feverState === 1) {
                const pLeft = project(-boxHalf, 0, z, camera.x, camera.y);
                ctx.save();
                ctx.translate(pLeft.x - (60 * scale), pLeft.y);
                ctx.font = `900 ${40 * scale}px "3x3"`;
                ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText("2x", 0, 0);
                ctx.restore();
            }

            // --- AUTO/SPACE TEXT (Bottom Center) ---
            
            if (STATE.feverState === 1) {
                const alpha = Math.abs(Math.sin(Date.now() / 200));
                ctx.save();
                // Move DOWN outwards from the bottom edge
                ctx.translate(pBotCenter.x, pBotCenter.y + (30 * scale)); 
                ctx.font = `bold ${20 * scale}px "3x3"`;
                ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
                ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
                ctx.textAlign = 'center'; 
                ctx.textBaseline = 'top'; // Draw downwards from the anchor
                ctx.fillText("[ SPACE TO AUTO ] ", 0, 0);
                ctx.restore();
            }

            if (STATE.feverState === 2) {
                ctx.save();
                // Move DOWN outwards
                ctx.translate(pBotCenter.x, pBotCenter.y + (30 * scale));

                ctx.font = `900 ${24 * scale}px "3x3"`;
                ctx.fillStyle = `#00ffcc`;
                ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 20;
                ctx.textAlign = 'center'; 
                ctx.textBaseline = 'top'; 
                ctx.fillText("AUTO PILOT", 0, 0);

                if (STATE.fever < 25) {
                    const flash = (Math.sin(Date.now() / 100) + 1) / 2; 
                    ctx.font = `900 ${20 * scale}px "3x3"`;
                    ctx.fillStyle = `rgba(255, 0, 0, ${flash})`;
                    ctx.shadowColor = 'red'; ctx.shadowBlur = 20 * flash;
                    // Draw BELOW the "AUTO PILOT" text (Positive Y)
                    ctx.fillText("⚠ LOW ENERGY ⚠", 0, 30 * scale);
                }

                ctx.restore();
            }
        }

        function loop() {
        requestAnimationFrame(loop);

        viewShake.x = (Math.random() - 0.5) * camera.shake;
        viewShake.y = (Math.random() - 0.5) * camera.shake;

        camera.recoil *= 0.5; if (camera.recoil < 0.5) camera.recoil = 0;
        camera.shake *= 0.5; if (camera.shake < 0.5) camera.shake = 0;

        let dt = 1 / 60;
        if (STATE.status === 'PLAYING') {
            if (STATE.currentTime < 0) {
                STATE.currentTime += dt;
                const cdVal = Math.ceil(Math.abs(STATE.currentTime));
                const cdEl = document.getElementById('countdown');
                cdEl.style.display = 'block'; cdEl.innerText = cdVal;
                if (STATE.currentTime >= 0) { STATE.currentTime = 0; cdEl.style.display = 'none'; if (ytReady) ytPlayer.playVideo(); }
            } else if (ytReady && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                STATE.currentTime = ytPlayer.getCurrentTime();
            }

            STATE.displayedScore += (STATE.score - STATE.displayedScore) * 0.1;
            
            if (STATE.feverState > 0) {
                let drainRate = (STATE.feverState === 1) ? 2 * dt : 0 * dt;
                STATE.fever -= drainRate;
                if (STATE.fever <= 0) {
                    STATE.fever = 0; STATE.feverState = 0;
                }
            }

            UI_ANIM.comboScale += (1.0 - UI_ANIM.comboScale) * 0.1;

            let tempTime = Math.max(0, STATE.currentTime - (STATE.offset / 1000));
            let curBeatLogic = timeToBeat(tempTime);

            if (!STATE.isFading && curBeatLogic > STATE.lastNoteBeat + 4) {
                STATE.isFading = true;
                STATE.fadeStartTime = Date.now();
            }

            if (STATE.isFading) {
                const elapsed = (Date.now() - STATE.fadeStartTime) / 5000;
                if (elapsed >= 1.0) finishGame();
                else {
                    const volume = 100 * (1.0 - elapsed);
                    if (ytReady) ytPlayer.setVolume(volume);
                    canvas.style.opacity = (1.0 - elapsed);
                }
            }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let effectiveTime = Math.max(0, STATE.currentTime - (STATE.offset / 1000));
        let curBeat = timeToBeat(effectiveTime);

        const blur = getInterpolatedValue(curBeat, 'bloom-blur');
        const glow = getInterpolatedValue(curBeat, 'bloom-bright');
        const dim = getInterpolatedValue(curBeat, 'bg-dim');
        let op = getInterpolatedValue(curBeat, 'playfield-op');
        if (STATE.isFading) op = canvas.style.opacity;
        else document.documentElement.style.setProperty('--playfield-op', op);

        document.documentElement.style.setProperty('--bloom-blur', blur + "px");
        document.documentElement.style.setProperty('--bloom-bright', glow);
        document.documentElement.style.setProperty('--bg-dim', dim);

        const pX = -camera.x * 20; const pY = camera.y * 20;
        bgVideo.style.transform = `scale(1.1) translate(${pX}px, ${pY}px)`;

        targetCamera.x = mouse.x * 150; targetCamera.y = -mouse.y * 150;
        camera.x += (targetCamera.x - camera.x) * 0.1; camera.y += (targetCamera.y - camera.y) * 0.1;

        const dimSize = (CONFIG.gridDim * CONFIG.gridSpacing) / 2;
        const pts = [[-dimSize, -dimSize], [dimSize, -dimSize], [-dimSize, dimSize], [dimSize, dimSize]];
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; ctx.beginPath();
        pts.forEach(p => {
            const p1 = project(p[0], p[1], 0, camera.x, camera.y); const p2 = project(p[0], p[1], 2000, camera.x, camera.y);
            ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
        }); ctx.stroke();

        const visible = mapData.filter(n => n.beat > curBeat - 4 && n.beat < curBeat + 32).sort((a, b) => b.beat - a.beat);
        
        // --- IMPROVED AUTO PILOT VARIABLE ---
        let closestAutoCandidate = null; 
        // ------------------------------------

        visible.forEach(n => {
            const dist = getVisualDistance(curBeat, n.beat);

            if (dist < -1000 || dist > CONFIG.approachDistance) return;

            const z = CONFIG.hitZ + dist;
            const wx = (n.col - 1) * CONFIG.gridSpacing, wy = -(n.row - 1) * CONFIG.gridSpacing;
            const p = project(wx, wy, z, camera.x, camera.y);
            const size = CONFIG.gridSpacing * p.scale;
            const color = CONFIG.colors[n.type];

            if (STATE.status === 'PLAYING' && !n.hit && !n.missed) {
                const diff = n.beat - curBeat;
                const absDiff = Math.abs(diff);

                // --- IMPROVED AUTO PILOT LOGIC ---
                if (STATE.feverState === 2 && n.type < 2) {
                    
                    // 1. Precise Hit Execution
                    if (absDiff <= 0.06) { // Slightly wider window for safety
                        n.hit = true;
                        // Force visual snap to note immediately (removes lag)
                        mouse.realX = p.x; 
                        mouse.realY = p.y;
                        doHit(wx, wy, z, color);
                    } 
                    // 2. Find closest FUTURE note to target
                    else if (diff > 0 && diff < 2.0) {
                        // If we don't have a candidate, or this note is closer in time than the previous candidate
                        if (!closestAutoCandidate || diff < closestAutoCandidate.diff) {
                            closestAutoCandidate = { x: p.x, y: p.y, diff: diff };
                        }
                    }
                }
                // ---------------------------------
                
                // Manual Play Logic
                else if (n.type < 2) {
                    if (absDiff < 0.15) {
                        const hitRange = (size / 2) + 20;
                        if (Math.abs(mouse.realX - p.x) < hitRange && Math.abs(mouse.realY - p.y) < hitRange) {
                            n.hit = true; doHit(wx, wy, z, color);
                        }
                    } else if (diff < -0.15) {
                        n.missed = true;
                        handleMiss();
                    }
                }
                else if (n.type === 2) {
                    let wallHit = false;
                    if (STATE.feverState !== 2) {
                        if (Math.abs(diff) < 0.1 && Math.abs(mouse.realX - p.x) < size / 2 && Math.abs(mouse.realY - p.y) < size / 2) {
                            n.hit = true;
                            wallHit = true;
                            STATE.misses++; STATE.combo = 0;
                            STATE.fever = Math.max(0, STATE.fever - 20);
                            playFailSound();
                            document.getElementById('flash-overlay').style.opacity = 0.2;
                            setTimeout(() => document.getElementById('flash-overlay').style.opacity = 0, 100);
                        }
                    }
                    if (!wallHit && diff < -0.1) {
                        n.missed = true;
                    }
                }
            }

            // Draw Note
            if (!n.hit) {
                if (n.type < 2 && n.beat > curBeat && n.beat < curBeat + 4) {
                    const dest = project(wx, wy, CONFIG.hitZ, camera.x, camera.y);
                    const aScale = 1 + ((n.beat - curBeat) * 2.5);
                    const os = CONFIG.gridSpacing * dest.scale * aScale;
                    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.globalAlpha = Math.max(0, 1 - (n.beat - curBeat) / 4);
                    ctx.strokeRect(dest.x - os / 2, dest.y - os / 2, os, os); ctx.globalAlpha = 1;
                }
                ctx.save(); ctx.translate(p.x, p.y);
                const alpha = Math.min(1, z / 300 + 0.3);
                ctx.shadowBlur = 15; ctx.shadowColor = color;
                if (n.type === 2) {
                    ctx.globalAlpha = alpha * 0.8; ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, size * 0.05);
                    ctx.strokeRect(-size / 2, -size / 2, size, size);
                    ctx.beginPath(); ctx.moveTo(-size / 2, -size / 2); ctx.lineTo(size / 2, size / 2); ctx.moveTo(size / 2, -size / 2); ctx.lineTo(-size / 2, size / 2); ctx.stroke();
                    ctx.fillStyle = color; ctx.globalAlpha = alpha * 0.2; ctx.fillRect(-size / 2, -size / 2, size, size);
                } else {
                    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = Math.max(3, size * 0.12);
                    ctx.strokeRect(-size / 2, -size / 2, size, size);
                    ctx.globalAlpha = alpha * 0.15; ctx.fillStyle = color; ctx.fillRect(-size / 2, -size / 2, size, size);
                }
                ctx.restore();
            }
        });

        // --- IMPROVED MOVEMENT SMOOTHING ---
        if (STATE.feverState === 2 && closestAutoCandidate) {
            // Speed factor: 1.0 (Instant) if very close, 0.5 (Smooth) if far away
            // This ensures we snap to the note right before hitting it
            const speed = closestAutoCandidate.diff < 0.15 ? 0.8 : 0.4;
            
            mouse.realX += (closestAutoCandidate.x - mouse.realX) * speed;
            mouse.realY += (closestAutoCandidate.y - mouse.realY) * speed;
            
            // Recalculate normalized mouse coordinates for camera parallax
            mouse.x = (mouse.realX - canvas.width / 2) / (canvas.width / 2);
            mouse.y = (mouse.realY - canvas.height / 2) / (canvas.height / 2);
        }
        // -----------------------------------

        const hp = project(0, 0, CONFIG.hitZ, camera.x, camera.y);
        const hpSize = (CONFIG.gridDim * CONFIG.gridSpacing) * hp.scale;
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
        ctx.strokeRect(hp.x - hpSize / 2, hp.y - hpSize / 2, hpSize, hpSize);

        if (STATE.status === 'PLAYING') drawHUD();

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.z += p.vz; p.life -= 0.04;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            const pr = project(p.x, p.y, p.z, camera.x, camera.y);
            ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.fillRect(pr.x, pr.y, 6 * pr.scale, 6 * pr.scale);
        } ctx.globalAlpha = 1;

        if (STATE.status === 'PLAYING') {
            ctx.shadowBlur = 10; ctx.shadowColor = 'white'; ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.globalAlpha = 0.5;
            if (STATE.feverState === 2) { ctx.strokeStyle = 'var(--auto)'; ctx.shadowColor = 'var(--auto)'; }
            else if (STATE.feverState === 1) { ctx.strokeStyle = 'var(--gold)'; ctx.shadowColor = 'var(--gold)'; }
            const size = 40; 
            ctx.strokeRect(mouse.realX - size / 2, mouse.realY - size / 2, size, size);
            
            ctx.shadowBlur = 0;
        }
    }
        resize();
        loop();

    </script>
</body>
