<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chart Editor: Locked Mouse</title>
    <style>
        :root {
            --p: #ff96d3;
            --s: #78b7ff;
            --w: #ff4444;
            --bg: #111;
            --grid-dim: 3;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            user-select: none;
        }

        canvas {
            display: block;
        }

        #editor-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .toolbar {
            pointer-events: auto;
            background: #222;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 2px solid #444;
            flex-wrap: wrap;
        }

        .toolbar input,
        .toolbar button,
        .toolbar select {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .toolbar button:hover {
            background: #444;
        }

        .toolbar .separator {
            width: 1px;
            height: 24px;
            background: #555;
            margin: 0 5px;
        }

        /* Grouping for clearer UI */
        .group {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 4px;
        }

        #editor-grid-layer {
            flex: 1;
            position: relative;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #placement-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 0px;
            border: 2px solid #444;
        }

        .p-cell {
            width: 60px;
            height: 60px;
            border: 1px solid #444;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: 0.1s;
            position: relative;
            box-sizing: border-box;
        }

        .p-cell:hover {
            border-color: white;
            background: rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .p-cell.has-note {
            background: var(--s);
            border-color: var(--s);
            box-shadow: 0 0 15px var(--s);
            z-index: 1;
        }

        .p-cell.has-note.type-1 {
            background: var(--p);
            border-color: var(--p);
            box-shadow: 0 0 15px var(--p);
        }

        /* Wall Styling in Editor */
        .p-cell.has-note.type-2 {
            background: rgba(255, 68, 68, 0.3);
            border-color: var(--w);
            box-shadow: 0 0 15px var(--w);
            background-image: linear-gradient(45deg, transparent 45%, var(--w) 45%, var(--w) 55%, transparent 55%),
                              linear-gradient(-45deg, transparent 45%, var(--w) 45%, var(--w) 55%, transparent 55%);
            background-size: 20px 20px;
        }

        #timeline-container {
            height: 120px;
            background: #1a1a1a;
            pointer-events: auto;
            position: relative;
            border-top: 2px solid #444;
            overflow: hidden;
            cursor: col-resize;
        }

        #game-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 0.25em;
            justify-content: center;
            align-items: center;
            transform: translateX(-50%);
            text-shadow: 0 0 10px white;
            pointer-events: none;
            display: none;
            z-index: 5;
            width: 100%;
        }

        #score-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #combo {
            font-size: 40px;
            color: var(--s);
        }

        #countdown-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px var(--p);
            pointer-events: none;
            z-index: 20;
            display: none;
        }

        #flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: red;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 0.1s;
        }

        .controls-hint {
            position: absolute;
            bottom: 140px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 14px;
            pointer-events: none;
        }
        
        .autoplay-label {
            background: #4a2c4a; 
            border: 1px solid #754675; 
            padding: 5px 10px; 
            border-radius: 4px;
        }
        .autoplay-label input {
            margin-right: 5px;
        }
    </style>
</head>

<body>

    <div id="flash-overlay"></div>

    <div id="editor-ui">
        <div class="toolbar">
            <button onclick="document.getElementById('audioInput').click()">Load MP3</button>
            <input type="file" id="audioInput" accept="audio/*" style="display:none">

            <div class="separator"></div>

            <div class="group">
                <label>BPM <input type="number" id="bpmInput" value="128" style="width: 40px"></label>
                <label>Snap
                    <select id="snapSelect">
                        <option value="1">1/1</option>
                        <option value="0.5">1/2</option>
                        <option value="0.25" selected>1/4</option>
                        <option value="0.125">1/8</option>
                    </select>
                </label>
                <label title="Chart Offset (ms)">Offset <input type="number" id="offsetInput" value="0" style="width: 40px"></label>
            </div>

            <div class="separator"></div>

            <div class="group" style="border: 1px solid #78b7ff">
                <label title="User Preference: Base Scroll Speed">Base Spd:
                    <input type="number" id="baseSpeedInput" value="800" step="50" style="width: 50px">
                </label>
                <div class="separator"></div>
                <label title="Chart Multiplier Event at current beat">Mult:
                    <input type="number" id="multInput" value="1.0" step="0.1" style="width: 40px" onchange="addSpeedEvent()">
                    x
                </label>
            </div>

            <div class="separator"></div>

            <button id="playPauseBtn" onclick="togglePlay()">Play</button>

            <div style="display:flex; align-items:center; gap:5px; background:#333; padding:0 10px; border-radius:4px; cursor:pointer;"
                onclick="cycleNoteType()">
                <span id="typeLabel">Note 1</span>
                <div style="width: 20px; height: 20px; background: #78b7ff; border: 1px solid white;" id="colorInd"></div>
            </div>

            <div class="separator"></div>

            <button onclick="copySelection()" title="Ctrl+C">Copy</button>
            <button onclick="pasteSelection()" title="Ctrl+V">Paste</button>
            <button onclick="deleteSelection()" title="Delete">Del</button>

            <div class="separator"></div>

            <button onclick="invertSelectionX()">Flip X</button>
            <button onclick="invertSelectionY()">Flip Y</button>

            <div class="separator"></div>

            <button onclick="mapData=[]; speedEvents=[{beat:0, mult:1}]; updateGridHighlight();">Clear</button>
            <button onclick="exportMap()">Save</button>
            <button onclick="document.getElementById('mapInput').click()">Load</button>
            <input type="file" id="mapInput" accept=".json" style="display:none">

            <div style="flex:1"></div>
            
            <label class="autoplay-label">
                <input type="checkbox" id="autoplayCheck">Autoplay
            </label>
            
            <button onclick="toggleMode()"
                style="background:#ff96d3; border:none; color:black; font-weight:bold; padding: 10px 20px;">PLAY</button>
        </div>

        <div id="editor-grid-layer">
            <div id="placement-grid">
            </div>
            <div class="controls-hint">Space: Play | Arrows: Seek | Click: Place/Remove | Type 3 = Wall</div>
        </div>

        <div id="timeline-container">
            <canvas id="timelineCanvas"></canvas>
        </div>
    </div>

    <div id="game-ui">
        <div id="score-container">
            <div id="score">Score: 0</div>
            <div id="combo">0</div>
        </div>
        <div id="countdown-overlay">3</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /** 
         * CONFIGURATION
         */
        const CONFIG = {
            gridDim: 3,
            gridSpacing: 100,
            fov: 350,
            approachDistance: 8000,
            hitZ: 50,
            colors: ['#78b7ff', '#ff96d3', '#ff4444'], // Type 0, 1, 2 (Wall)
            startBuffer: 3.0
        };

        const STATE = {
            mode: 'EDITOR',
            bpm: 128,
            snap: 0.25,
            offset: 0,
            baseSpeed: 2000,
            isPlaying: false,
            isAutoplay: false,
            currentTime: 0,
            duration: 0,
            noteType: 0,
            score: 0,
            combo: 0
        };

        let mapData = [];
        let speedEvents = [{ beat: 0, mult: 1.0 }];

        let selection = { active: false, startBeat: 0, endBeat: 0 };
        let clipboard = null;
        
        // Tracking for randomized autoplay
        let autoplayTarget = { note: null, offX: 0, offY: 0 };

        const audio = new Audio();
        audio.addEventListener('loadedmetadata', () => STATE.duration = audio.duration);
        audio.addEventListener('ended', () => {
            STATE.isPlaying = false;
            if (STATE.mode === 'GAME') toggleMode();
        });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastTime = performance.now();

        function playHitSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playFailSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const tCanvas = document.getElementById('timelineCanvas');
        const tCtx = tCanvas.getContext('2d');

        const mouse = { x: 0, y: 0, realX: 0, realY: 0 };
        const camera = { x: 0, y: 0 };
        const targetCamera = { x: 0, y: 0 };

        /**
         * INIT
         */
        function init() {
            resize();
            window.addEventListener('resize', resize);
            createGridUI();
            requestAnimationFrame(loop);

            document.getElementById('bpmInput').addEventListener('change', (e) => STATE.bpm = parseFloat(e.target.value) || 128);
            document.getElementById('snapSelect').addEventListener('change', (e) => STATE.snap = parseFloat(e.target.value));
            document.getElementById('offsetInput').addEventListener('change', (e) => STATE.offset = parseFloat(e.target.value) || 0);
            document.getElementById('baseSpeedInput').addEventListener('change', (e) => STATE.baseSpeed = parseFloat(e.target.value) || 800);
            
            document.getElementById('autoplayCheck').addEventListener('change', (e) => STATE.isAutoplay = e.target.checked);

            document.getElementById('audioInput').addEventListener('change', e => {
                const f = e.target.files[0];
                if (f) audio.src = URL.createObjectURL(f);
            });
            document.getElementById('mapInput').addEventListener('change', e => {
                const f = e.target.files[0];
                if (f) {
                    const r = new FileReader();
                    r.onload = ev => {
                        try {
                            const d = JSON.parse(ev.target.result);
                            STATE.bpm = d.bpm;
                            mapData = d.notes;
                            STATE.offset = d.offset || 0;
                            if(d.speedEvents) {
                                speedEvents = d.speedEvents.map(ev => {
                                    if(ev.val !== undefined && ev.mult === undefined) {
                                        return { beat: ev.beat, mult: ev.val / 800 }; 
                                    }
                                    return ev;
                                });
                            } else {
                                speedEvents = [{beat:0, mult: 1.0}];
                            }
                            document.getElementById('bpmInput').value = STATE.bpm;
                            document.getElementById('offsetInput').value = STATE.offset;
                            updateMultInput();
                        } catch (err) { 
                            console.error(err);
                            alert("Error loading JSON"); 
                        }
                    };
                    r.readAsText(f);
                }
            });

            window.addEventListener('keydown', e => {
                if (STATE.mode === 'EDITOR') {
                    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
                    if (e.code === 'ArrowLeft') seek(-STATE.snap);
                    if (e.code === 'ArrowRight') seek(STATE.snap);

                    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyC') copySelection();
                    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyV') pasteSelection();
                    if (e.code === 'Delete' || e.code === 'Backspace') deleteSelection();
                    if (e.code === 'Tab') { e.preventDefault(); cycleNoteType(); }
                } else {
                    if (e.code === 'Escape') toggleMode();
                }
            });

            // Re-engage pointer lock if clicking during game
            canvas.addEventListener('mousedown', () => {
                if(STATE.mode === 'GAME' && document.pointerLockElement !== canvas) {
                    canvas.requestPointerLock();
                }
            });
            
            // Handle Pointer Lock changes (e.g. user presses ESC)
            document.addEventListener('pointerlockchange', () => {
                if(STATE.mode === 'GAME' && document.pointerLockElement !== canvas) {
                    // Lock lost. We could pause here or force editor mode.
                    // For now, we rely on the Escape key handler to toggle mode,
                    // but if they Alt-Tab out, this is where you'd pause.
                }
            });

            window.addEventListener('mousemove', e => {
                if (STATE.mode === 'GAME' && STATE.isAutoplay) return;

                // --- MODIFIED: Pointer Lock Logic ---
                if (document.pointerLockElement === canvas) {
                    // Add Movement Delta to accumulated position
                    mouse.realX += e.movementX;
                    mouse.realY += e.movementY;

                    // Clamp to canvas boundaries
                    if(mouse.realX < 0) mouse.realX = 0;
                    if(mouse.realX > canvas.width) mouse.realX = canvas.width;
                    if(mouse.realY < 0) mouse.realY = 0;
                    if(mouse.realY > canvas.height) mouse.realY = canvas.height;

                    // Normalize (-1 to 1)
                    mouse.x = (mouse.realX - canvas.width / 2) / (canvas.width / 2);
                    mouse.y = (mouse.realY - canvas.height / 2) / (canvas.height / 2);
                } 
                else {
                    // Standard cursor tracking (Editor)
                    mouse.realX = e.clientX;
                    mouse.realY = e.clientY;

                    if (STATE.mode === 'GAME') {
                        mouse.x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
                        mouse.y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
                    } else {
                        mouse.x = (e.clientX / canvas.width) * 2 - 1;
                        mouse.y = -(e.clientY / canvas.height) * 2 + 1;
                    }
                }
            });

            const tl = document.getElementById('timeline-container');
            let isDrag = false;
            let dragMode = '';

            const getBeatFromMouse = (clientX) => {
                const rect = tCanvas.getBoundingClientRect();
                const centerX = rect.width / 2;
                const pxPerBeat = 100;
                const curBeat = STATE.currentTime * (STATE.bpm / 60);
                const dx = clientX - rect.left - centerX;
                const beatOffset = dx / pxPerBeat;
                return curBeat + beatOffset;
            };

            const snapBeat = (val) => {
                return Math.round(val / STATE.snap) * STATE.snap;
            };

            tl.addEventListener('mousedown', e => {
                isDrag = true;
                if (e.shiftKey) {
                    dragMode = 'select';
                    selection.active = true;
                    const b = getBeatFromMouse(e.clientX);
                    const sb = snapBeat(b);
                    selection.startBeat = sb;
                    selection.endBeat = sb;
                } else {
                    dragMode = 'scrub';
                    selection.active = false;
                    doScrub(e);
                }
            });

            const doScrub = (e) => {
                const rect = tCanvas.getBoundingClientRect();
                const centerX = rect.width / 2;
                const pxPerBeat = 100;
                const dx = e.clientX - rect.left - centerX;
                const beatOffset = dx / pxPerBeat;
                const timeOffset = beatOffset * (60 / STATE.bpm);

                let newTime = STATE.currentTime + timeOffset;
                if (newTime < 0) newTime = 0;
                if (newTime > STATE.duration) newTime = STATE.duration;

                audio.currentTime = newTime;
                STATE.currentTime = newTime;
                updateMultInput();
            };

            window.addEventListener('mousemove', e => {
                if (isDrag) {
                    if (dragMode === 'scrub') {
                        doScrub(e);
                    } else if (dragMode === 'select') {
                        const b = getBeatFromMouse(e.clientX);
                        selection.endBeat = snapBeat(b);
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                isDrag = false;
                if (selection.active) {
                    if (selection.startBeat > selection.endBeat) {
                        const temp = selection.startBeat;
                        selection.startBeat = selection.endBeat;
                        selection.endBeat = temp;
                    }
                }
            });
        }

        /**
         * SPEED LOGIC
         */
        function getCurrentMult(beat) {
            let val = 1.0;
            for(let e of speedEvents) {
                if(e.beat <= beat) val = e.mult;
                else break; 
            }
            return val;
        }

        function addSpeedEvent() {
            const beat = getSnappedBeat();
            const val = parseFloat(document.getElementById('multInput').value);
            speedEvents = speedEvents.filter(e => Math.abs(e.beat - beat) > 0.01);
            speedEvents.push({ beat: beat, mult: val });
            speedEvents.sort((a,b) => a.beat - b.beat);
            if(speedEvents[0].beat > 0) {
                speedEvents.unshift({ beat: 0, mult: 1.0 });
            }
        }

        function updateMultInput() {
            const curBeat = STATE.currentTime * (STATE.bpm / 60);
            const s = getCurrentMult(curBeat);
            if(document.activeElement !== document.getElementById('multInput')) {
                document.getElementById('multInput').value = s;
            }
        }

        function getVisualDistance(currentBeat, noteBeat) {
            if(noteBeat < currentBeat) {
                 return -getVisualDistance(noteBeat, currentBeat);
            }
            let dist = 0;
            let cursor = currentBeat;
            let activeEvents = speedEvents.filter(e => e.beat > cursor && e.beat < noteBeat);
            let currentMult = getCurrentMult(cursor);
            for(let e of activeEvents) {
                dist += (e.beat - cursor) * STATE.baseSpeed * currentMult;
                cursor = e.beat;
                currentMult = e.mult;
            }
            dist += (noteBeat - cursor) * STATE.baseSpeed * currentMult;
            return dist;
        }

        /**
         * EDITOR LOGIC
         */
        function copySelection() {
            if (!selection.active) return;
            const s = Math.min(selection.startBeat, selection.endBeat);
            const e = Math.max(selection.startBeat, selection.endBeat);
            const notes = mapData.filter(n => n.beat >= s - 0.01 && n.beat <= e + 0.01);
            clipboard = notes.map(n => ({ ...n, beat: n.beat - s }));
        }

        function pasteSelection() {
            if (!clipboard || clipboard.length === 0) return;
            const curBeat = getSnappedBeat();
            clipboard.forEach(n => {
                const newBeat = curBeat + n.beat;
                const exists = mapData.find(ex => Math.abs(ex.beat - newBeat) < 0.01 && ex.col === n.col && ex.row === n.row);
                if (!exists) {
                    mapData.push({ beat: newBeat, col: n.col, row: n.row, type: n.type });
                }
            });
            updateGridHighlight();
        }

        function deleteSelection() {
            if (!selection.active) return;
            const s = Math.min(selection.startBeat, selection.endBeat);
            const e = Math.max(selection.startBeat, selection.endBeat);
            mapData = mapData.filter(n => n.beat < s - 0.01 || n.beat > e + 0.01);
            selection.active = false;
            updateGridHighlight();
        }

        function invertSelectionX() {
            if (!selection.active) return;
            processSelection(n => n.col = (CONFIG.gridDim - 1) - n.col);
        }

        function invertSelectionY() {
            if (!selection.active) return;
            processSelection(n => n.row = (CONFIG.gridDim - 1) - n.row);
        }

        function processSelection(fn) {
             const s = Math.min(selection.startBeat, selection.endBeat);
             const e = Math.max(selection.startBeat, selection.endBeat);
             mapData.forEach(n => {
                if (n.beat >= s - 0.01 && n.beat <= e + 0.01) fn(n);
             });
             updateGridHighlight();
        }

        function createGridUI() {
            const grid = document.getElementById('placement-grid');
            grid.innerHTML = '';
            for (let r = 0; r < CONFIG.gridDim; r++) {
                for (let c = 0; c < CONFIG.gridDim; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'p-cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = () => toggleNoteAtCursor(c, r);
                    grid.appendChild(cell);
                }
            }
        }

        function cycleNoteType() {
            STATE.noteType = (STATE.noteType + 1) % 3;
            const labels = ["Note 1", "Note 2", "Wall"];
            document.getElementById('typeLabel').innerText = labels[STATE.noteType];
            document.getElementById('colorInd').style.background = CONFIG.colors[STATE.noteType];
        }

        function seek(beatDelta) {
            const secPerBeat = 60 / STATE.bpm;
            let newTime = audio.currentTime + (beatDelta * secPerBeat);
            if (newTime < 0) newTime = 0;
            audio.currentTime = newTime;
            STATE.currentTime = newTime;
            updateMultInput();
        }

        function getSnappedBeat() {
            const beat = STATE.currentTime * (STATE.bpm / 60);
            return Math.round(beat / STATE.snap) * STATE.snap;
        }

        function toggleNoteAtCursor(col, row) {
            const beat = getSnappedBeat();
            const idx = mapData.findIndex(n => Math.abs(n.beat - beat) < 0.01 && n.col === col && n.row === row);

            if (idx !== -1) {
                mapData.splice(idx, 1);
            } else {
                mapData.push({ beat, col, row, type: STATE.noteType });
                playHitSound();
                if (STATE.noteType === 0) {
                    STATE.noteType = 1;
                } else if (STATE.noteType === 1) {
                    STATE.noteType = 0;
                }
                const labels = ["Note 1", "Note 2", "Wall"];
                document.getElementById('typeLabel').innerText = labels[STATE.noteType];
                document.getElementById('colorInd').style.background = CONFIG.colors[STATE.noteType];
            }
            updateGridHighlight();
        }

        function updateGridHighlight() {
            const beat = getSnappedBeat();
            document.querySelectorAll('.p-cell').forEach(c => {
                c.className = 'p-cell';
                const r = parseInt(c.dataset.r);
                const col = parseInt(c.dataset.c);
                const note = mapData.find(n => Math.abs(n.beat - beat) < 0.01 && n.col === col && n.row === r);
                if (note) {
                    c.classList.add('has-note');
                    if (note.type === 1) c.classList.add('type-1');
                    if (note.type === 2) c.classList.add('type-2');
                }
            });
        }

        function drawTimeline() {
            tCtx.fillStyle = '#111';
            tCtx.fillRect(0, 0, tCanvas.width, tCanvas.height);

            const pxPerBeat = 100;
            const cx = tCanvas.width / 2;
            const curBeat = STATE.currentTime * (STATE.bpm / 60);

            const visBeats = (cx / pxPerBeat) + 1;
            const startB = Math.floor(curBeat - visBeats);
            const endB = Math.floor(curBeat + visBeats);

            if (selection.active) {
                const s = Math.min(selection.startBeat, selection.endBeat);
                const e = Math.max(selection.startBeat, selection.endBeat);
                const sx = cx + (s - curBeat) * pxPerBeat;
                const ex = cx + (e - curBeat) * pxPerBeat;

                tCtx.fillStyle = 'rgba(120, 183, 255, 0.2)';
                tCtx.fillRect(sx, 0, ex - sx, tCanvas.height);
            }

            for (let b = startB; b <= endB; b++) {
                const x = cx + (b - curBeat) * pxPerBeat;
                tCtx.strokeStyle = (b % 4 === 0) ? '#666' : '#333';
                tCtx.lineWidth = (b % 4 === 0) ? 2 : 1;
                tCtx.beginPath(); tCtx.moveTo(x, 0); tCtx.lineTo(x, tCanvas.height); tCtx.stroke();

                if (b >= 0 && b % 4 === 0) {
                    tCtx.fillStyle = '#888';
                    tCtx.fillText(b, x + 5, 12);
                }
            }
            
            speedEvents.forEach(e => {
                const x = cx + (e.beat - curBeat) * pxPerBeat;
                if(x > -10 && x < tCanvas.width + 10) {
                    tCtx.fillStyle = '#ffd700';
                    tCtx.beginPath();
                    tCtx.moveTo(x, tCanvas.height - 10);
                    tCtx.lineTo(x-5, tCanvas.height);
                    tCtx.lineTo(x+5, tCanvas.height);
                    tCtx.fill();
                    tCtx.fillStyle = '#ffd700';
                    tCtx.fillText(e.mult + "x", x + 5, tCanvas.height - 15);
                }
            });

            const selStart = Math.min(selection.startBeat, selection.endBeat);
            const selEnd = Math.max(selection.startBeat, selection.endBeat);

            mapData.forEach(n => {
                const x = cx + (n.beat - curBeat) * pxPerBeat;
                if (x > -10 && x < tCanvas.width + 10) {
                    const h = tCanvas.height / CONFIG.gridDim;
                    const y = n.row * h;
                    tCtx.fillStyle = CONFIG.colors[n.type];
                    tCtx.fillRect(x - 4, y + 2, 8, h - 4);

                    if (selection.active && n.beat >= selStart - 0.01 && n.beat <= selEnd + 0.01) {
                        tCtx.strokeStyle = 'white';
                        tCtx.lineWidth = 2;
                        tCtx.strokeRect(x - 5, y + 1, 10, h - 2);
                    }
                }
            });

            tCtx.strokeStyle = '#fff';
            tCtx.lineWidth = 2;
            tCtx.beginPath(); tCtx.moveTo(cx, 0); tCtx.lineTo(cx, tCanvas.height); tCtx.stroke();
        }

        /**
         * 3D RENDERER
         */
        function project(x, y, z, camX, camY) {
            if (z < 1) z = 1;
            const scale = CONFIG.fov / (z + CONFIG.fov);
            const screenX = ((x - camX) * scale) + (canvas.width / 2);
            const screenY = ((y - camY) * scale) + (canvas.height / 2);
            return { x: screenX, y: screenY, scale: scale };
        }

        function renderGame() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let effectiveTime = STATE.currentTime - (STATE.offset / 1000);
            
            // --- UPDATED: Human-like Autoplay Logic ---
            if (STATE.mode === 'GAME' && STATE.isAutoplay) {
                const curBeat = effectiveTime * (STATE.bpm / 60);
                const targets = mapData.filter(n => !n.hit && !n.missed && n.type < 2 && n.beat >= curBeat - 0.1)
                                    .sort((a,b) => a.beat - b.beat);
                
                let targetX = canvas.width / 2;
                let targetY = canvas.height / 2;

                if (targets.length > 0) {
                    const n = targets[0];
                    const offset = Math.floor(CONFIG.gridDim / 2);
                    const wx = (n.col - offset) * CONFIG.gridSpacing;
                    const wy = -(n.row - offset) * CONFIG.gridSpacing;
                    
                    const p = project(wx, wy, CONFIG.hitZ, camera.x, camera.y);
                    const size = CONFIG.gridSpacing * p.scale;

                    // If target changed, pick a new random spot *within* the note hit area
                    if (autoplayTarget.note !== n) {
                        autoplayTarget.note = n;
                        // 0.6 factor ensures we stay well within the note bounds (human accuracy)
                        // but not perfectly in center (human imperfection)
                        const safeRadius = (size / 2) * 0.6; 
                        autoplayTarget.offX = (Math.random() - 0.5) * 2 * safeRadius;
                        autoplayTarget.offY = (Math.random() - 0.5) * 2 * safeRadius;
                    }

                    targetX = p.x + autoplayTarget.offX;
                    targetY = p.y + autoplayTarget.offY;
                } else {
                    autoplayTarget.note = null;
                }

                // Add "Hand Tremor" / Noise
                const time = performance.now() / 1000;
                // Combine low freq sway and high freq jitter
                const noiseX = (Math.sin(time * 3) * 10) + (Math.cos(time * 17) * 3);
                const noiseY = (Math.cos(time * 4) * 10) + (Math.sin(time * 19) * 3);

                targetX += noiseX;
                targetY += noiseY;

                // Calculate distance to target
                const dx = targetX - mouse.realX;
                const dy = targetY - mouse.realY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                // Dynamic Speed: Move fast when snapping to new note, settle slowly when close
                let factor = 0.1 + (dist / 1000) * 0.5; 
                if(factor > 0.5) factor = 0.5;
                if(factor < 0.15) factor = 0.15;

                mouse.realX += (targetX - mouse.realX) * factor;
                mouse.realY += (targetY - mouse.realY) * factor;
                
                mouse.x = (mouse.realX - canvas.width/2) / (canvas.width/2);
                mouse.y = (mouse.realY - canvas.height/2) / (canvas.height/2);
            }
            // -------------------------------------------

            const parallaxStrength = 150;
            targetCamera.x = mouse.x * parallaxStrength;
            targetCamera.y = mouse.y * parallaxStrength;

            camera.x += (targetCamera.x - camera.x) * 0.1;
            camera.y += (targetCamera.y - camera.y) * 0.1;

            drawTunnel(camera.x, camera.y);

            const curBeat = effectiveTime * (STATE.bpm / 60);

            const visibleNotes = mapData.filter(n => {
                return (n.beat > curBeat - 4 && n.beat < curBeat + 32); 
            }).sort((a, b) => b.beat - a.beat);

            visibleNotes.forEach(n => {
                const dist = getVisualDistance(curBeat, n.beat);
                
                if (dist < -200 || dist > CONFIG.approachDistance) return;

                const z = CONFIG.hitZ + dist;
                const color = CONFIG.colors[n.type];

                const offset = Math.floor(CONFIG.gridDim / 2);
                const wx = (n.col - offset) * CONFIG.gridSpacing;
                const wy = -(n.row - offset) * CONFIG.gridSpacing;

                const p = project(wx, wy, z, camera.x, camera.y);
                const size = CONFIG.gridSpacing * p.scale;

                // GAME LOGIC
                if (STATE.mode === 'GAME' && !n.hit && !n.missed) {
                    const timeDiff = n.beat - curBeat; 
                    
                    // --- AUTOPLAY LOGIC ---
                    if (STATE.isAutoplay && n.type < 2) {
                        // Automatically hit when it passes the hit threshold
                        if (n.beat <= curBeat) {
                            n.hit = true;
                            STATE.combo++;
                            STATE.score += 100 + (STATE.combo * 10);
                            spawnParticles(wx, wy, z, color);
                            playHitSound();
                            updateScore();
                        }
                    }
                    // --- NORMAL PLAY LOGIC ---
                    else if (n.type < 2) { 
                        if (Math.abs(timeDiff) < 0.15) {
                            const dx = Math.abs(mouse.realX - p.x);
                            const dy = Math.abs(mouse.realY - p.y);
                            if (dx < size / 2 && dy < size / 2) {
                                n.hit = true;
                                STATE.combo++;
                                STATE.score += 100 + (STATE.combo * 10);
                                spawnParticles(wx, wy, z, color);
                                playHitSound();
                                updateScore();
                            }
                        } else if (timeDiff < -0.15) {
                            n.missed = true;
                            STATE.combo = 0;
                            updateScore();
                        }
                    }
                    // --- WALL LOGIC ---
                    else if (n.type === 2) {
                        // Check collision only if NOT autoplaying
                        // (Autoplay makes walls harmless)
                        if (!STATE.isAutoplay) {
                            if (Math.abs(timeDiff) < 0.1) {
                                const dx = Math.abs(mouse.realX - p.x);
                                const dy = Math.abs(mouse.realY - p.y);
                                if (dx < size / 2 && dy < size / 2) {
                                    n.hit = true; 
                                    STATE.combo = 0;
                                    updateScore();
                                    playFailSound();
                                    const flash = document.getElementById('flash-overlay');
                                    flash.style.opacity = 0.15;
                                    setTimeout(() => flash.style.opacity = 0, 100);
                                }
                            }
                        } 
                        
                        // Pass wall
                        if (timeDiff < -0.1) {
                            n.missed = true;
                        }
                    }
                }

                // DRAWING
                if (!n.hit) {
                    if (n.type < 2 && n.beat > curBeat && n.beat < curBeat + 4) {
                         const dest = project(wx, wy, CONFIG.hitZ, camera.x, camera.y);
                         const approachScale = 1 + ((n.beat - curBeat) * 2.5);
                         const outSize = CONFIG.gridSpacing * dest.scale * approachScale;
                         
                         ctx.strokeStyle = color;
                         ctx.lineWidth = 2;
                         ctx.globalAlpha = Math.max(0, 1 - (n.beat - curBeat)/4);
                         ctx.strokeRect(dest.x - outSize/2, dest.y - outSize/2, outSize, outSize);
                         ctx.globalAlpha = 1;
                    }

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    const baseAlpha = Math.min(1, z / 300 + 0.3);
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = color;

                    if(n.type === 2) {
                        ctx.globalAlpha = baseAlpha * 0.8;
                        ctx.strokeStyle = color;
                        ctx.lineWidth = Math.max(2, size * 0.05);
                        
                        ctx.beginPath();
                        ctx.moveTo(-size/2, -size/2); ctx.lineTo(size/2, size/2);
                        ctx.moveTo(size/2, -size/2); ctx.lineTo(-size/2, size/2);
                        ctx.stroke();
                        
                        ctx.strokeRect(-size / 2, -size / 2, size, size);
                        
                        ctx.fillStyle = color;
                        ctx.globalAlpha = baseAlpha * 0.2;
                        ctx.fillRect(-size / 2, -size / 2, size, size);
                    } 
                    else {
                        ctx.globalAlpha = baseAlpha;
                        ctx.strokeStyle = color;
                        ctx.lineWidth = Math.max(3, size * 0.12);
                        ctx.strokeRect(-size / 2, -size / 2, size, size);

                        ctx.globalAlpha = baseAlpha * 0.15;
                        ctx.fillStyle = color;
                        ctx.fillRect(-size / 2, -size / 2, size, size);
                    }
                    ctx.restore();
                }
            });

            const hp = project(0, 0, CONFIG.hitZ, camera.x, camera.y);
            const totalGridSize = (CONFIG.gridDim * CONFIG.gridSpacing);
            const hpSize = totalGridSize * hp.scale;

            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 2;
            ctx.strokeRect(hp.x - hpSize / 2, hp.y - hpSize / 2, hpSize, hpSize);

            renderParticles(camera.x, camera.y);

            if (STATE.mode === 'GAME') drawCursor();
        }

        function drawTunnel(cx, cy) {
            const dim = (CONFIG.gridDim * CONFIG.gridSpacing) / 2;
            const corners = [
                { x: -dim, y: -dim }, { x: dim, y: -dim },
                { x: -dim, y: dim }, { x: dim, y: dim }
            ];

            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            corners.forEach(c => {
                const p1 = project(c.x, c.y, 0, cx, cy);
                const p2 = project(c.x, c.y, 2000, cx, cy);
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
            });
            ctx.stroke();
        }

        let particles = [];
        function spawnParticles(x, y, z, c) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x, y, z, c,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    vz: (Math.random() - 0.5) * 20,
                    life: 1
                });
            }
        }
        function renderParticles(cx, cy) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.z += p.vz;
                p.life -= 0.04;
                if (p.life <= 0) { particles.splice(i, 1); continue; }

                const proj = project(p.x, p.y, p.z, cx, cy);
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.c;
                ctx.fillRect(proj.x, proj.y, 6 * proj.scale, 6 * proj.scale);
            }
            ctx.globalAlpha = 1;
        }

        function drawCursor() {
            ctx.shadowBlur = 10; ctx.shadowColor = 'white';
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(mouse.realX, mouse.realY, 12, 0, Math.PI * 2); ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function updateScore() {
            document.getElementById('score').innerText = "Score: " + STATE.score;
            document.getElementById('combo').innerText = STATE.combo;
        }

        function togglePlay() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (STATE.isPlaying) { audio.pause(); STATE.isPlaying = false; }
            else {
                audio.play();
                STATE.isPlaying = true;
            }
        }

        function toggleMode() {
            if (STATE.mode === 'EDITOR') {
                STATE.mode = 'GAME';
                document.getElementById('editor-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'flex';

                STATE.score = 0; STATE.combo = 0; updateScore();
                mapData.forEach(n => { n.hit = false; n.missed = false; });
                
                // Initialize mouse.realX/Y center to avoid jump
                mouse.realX = canvas.width / 2;
                mouse.realY = canvas.height / 2;

                // --- ADDED: Request Pointer Lock ---
                canvas.requestPointerLock();

                // START FROM PLAYHEAD LOGIC
                // If we are at the very beginning (or very close), do the countdown
                if (audio.currentTime <= 0.1) {
                    STATE.currentTime = -CONFIG.startBuffer;
                    audio.currentTime = 0;
                    audio.pause();
                } else {
                    // Start immediately from current editor position
                    STATE.currentTime = audio.currentTime;
                    audio.play();
                }

                STATE.isPlaying = true;
                canvas.style.cursor = 'none';
            } else {
                STATE.mode = 'EDITOR';
                document.getElementById('editor-ui').style.display = 'flex';
                document.getElementById('game-ui').style.display = 'none';
                document.getElementById('countdown-overlay').style.display = 'none';

                // --- ADDED: Exit Pointer Lock ---
                document.exitPointerLock();

                audio.pause();
                STATE.isPlaying = false;
                STATE.currentTime = audio.currentTime;
                updateMultInput();

                canvas.style.cursor = 'default';
                camera.x = 0; camera.y = 0;
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const tc = document.getElementById('timeline-container');
            tCanvas.width = tc.offsetWidth;
            tCanvas.height = tc.offsetHeight;
        }

        function exportMap() {
            const d = { 
                bpm: STATE.bpm, 
                offset: STATE.offset, 
                notes: mapData,
                speedEvents: speedEvents
            };
            const blob = new Blob([JSON.stringify(d)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'rhythm-chart.json';
            a.click();
        }

        function loop() {
            const now = performance.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;

            if (STATE.mode === 'EDITOR') {
                if (STATE.isPlaying) {
                    STATE.currentTime = audio.currentTime;
                    updateMultInput();
                }
                updateGridHighlight();
                drawTimeline();
            }
            else if (STATE.mode === 'GAME') {
                if (STATE.isPlaying) {
                    // Only do countdown logic if we are in negative time
                    if (STATE.currentTime < 0) {
                        STATE.currentTime += dt;

                        const cd = document.getElementById('countdown-overlay');
                        cd.style.display = 'block';
                        if (STATE.currentTime < -2) cd.innerText = "3";
                        else if (STATE.currentTime < -1) cd.innerText = "2";
                        else if (STATE.currentTime < 0) cd.innerText = "1";

                        if (STATE.currentTime >= 0) {
                            STATE.currentTime = 0;
                            audio.currentTime = 0;
                            audio.play();
                            cd.innerText = "GO";
                            setTimeout(() => cd.style.display = 'none', 500);
                        }
                    }
                    else {
                        STATE.currentTime = audio.currentTime;
                    }
                }
            }

            renderGame();
            requestAnimationFrame(loop);
        }

        init();
    </script>
</body>
